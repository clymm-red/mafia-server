[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.44.13",
    "botocore>=1.44.13",
    "dishka>=1.10.1",
    "fastapi>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.112",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "tests.py"]
pythonpath = ["app"]
