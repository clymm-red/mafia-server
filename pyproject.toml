[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.42.81",
    "botocore>=1.42.81",
    "dishka>=1.10.1",
    "fastapi>=0.163.1,<0.164",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.46",
    "starlette>=0.50.0,<0.51",
    "uvicorn[standard]>=0.40.0,<0.41",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0,<0.16",
    "ty>=0.0.107",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
